<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор мира — Люди, Осколки и Владыки</title>
<link rel="stylesheet" href="va-styles.css">
</head>
<body style="background:#2b4a3f; background-image: radial-gradient(circle at 10% 20%, #3f6b5c, #1e352b); min-height:100vh; margin:0; padding:20px;">

<div style="max-width:1100px; margin: 0 auto 16px; display: flex; justify-content: space-between;">
  <a href="index.html" style="color:#efe6d5; text-decoration:none; font-weight:bold;">← На главную</a>
  <a href="rules.html" style="color:#efe6d5; text-decoration:none; font-weight:bold;">📖 Правила</a>
</div>

<div class="va-game">

  <div class="va-gen-panel">
    <h3>🎲 Настройки генерации</h3>

    <div class="va-gen-row">
      <label>Название мира:</label>
      <input type="text" id="va-worldName" placeholder="Мир Трёх Осколков">
    </div>

    <div class="va-gen-row">
      <label>Базовый TL мира:</label>
      <select id="va-baseTL">
        <option value="1">TL1 — Бронзовый век</option>
        <option value="2" selected>TL2 — Железный век</option>
        <option value="3">TL3 — Средневековье</option>
        <option value="4">TL4 — Ренессанс</option>
        <option value="5">TL5 — Промышленность</option>
      </select>
    </div>

    <div class="va-gen-row" style="align-items: flex-start;">
      <label>Осколки:</label>
      <div>
        <div id="va-shardsList" class="va-shards-list"></div>
        <button class="va-add-shard-btn" onclick="VA.UI.addShardSlot()">+ Добавить осколок</button>
      </div>
    </div>

    <div class="va-gen-row">
      <label>Раса:</label>
      <select id="va-raceSel"></select>
    </div>

    <div class="va-gen-row">
      <label>Технологии:</label>
      <select id="va-techMode" onchange="VA.UI.rebuildTechDetail()">
        <option value="random">Случайные</option>
        <option value="manual" selected>Вручную</option>
      </select>
    </div>
    <div id="va-techDetail"></div>

    <div class="va-gen-row">
      <label>Стартовые отряды:</label>
      <input type="number" id="va-troopCount" value="2" min="0" max="10">
    </div>

    <div class="va-gen-row">
      <label>Стартовая лояльность:</label>
      <input type="number" id="va-loyaltyVal" value="5" min="0" max="10">
    </div>

    <button class="va-gen-btn" onclick="VA.UI.generate()">🎲 Сгенерировать мир</button>
  </div>

  <div id="va-output"></div>

</div>

<script src="va-config.js"></script>
<script src="va-races.js"></script>
<script src="va-techs.js"></script>
<script src="va-buildings.js"></script>
<script src="va-troops.js"></script>
<script src="va-engine.js"></script>
<script src="va-storage.js"></script>
<script src="va-game.js"></script>
<script src="va-ui.js"></script>

</body>
</html>
